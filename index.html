<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concessions: The Guano Age — v0.1.8</title>
<style>
body{font:15px Georgia,serif;background:#eee4ce;color:#32291e;max-width:1150px;margin:auto;padding:22px}
h1,h2{color:#583b22}button,select,input{font:inherit;padding:7px;margin:3px;border:1px solid #947b58;border-radius:4px;background:#fffaf0}
button{cursor:pointer;background:#d9c29a}button:disabled{opacity:.45}section{background:#fff9e9;border:1px solid #c9b28a;padding:14px;margin:12px 0;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.player{padding:12px;border:2px solid #b6a17e;background:#fffdf6}
small{color:#685b49}.ship{display:inline-block;padding:5px;background:#e8dcc4;margin:3px;border-radius:4px}
.route-board{display:grid;grid-template-columns:1fr 1fr;gap:9px;background:#b7c9c4;padding:10px;border:4px double #75634a;border-radius:9px}.region{background:#f5edda;border:2px solid #b8a17b;border-radius:8px;min-height:112px;padding:10px}.region h3{margin:0 0 7px}.vessel{display:inline-block;background:#fffaf0;border:2px solid;border-radius:8px;padding:6px;margin:3px;font-size:13px}.port-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.port{border:2px solid #c5af88;border-radius:7px;padding:10px;background:#f8f0df}.marker{display:inline-block;border:2px solid;border-radius:18px;padding:5px 8px;margin:3px;background:#fff9e7;font-weight:bold}.turnbox{background:#e9d5a7;padding:10px;border-radius:6px;margin:10px 0}#log{max-height:240px;overflow:auto;white-space:pre-line;background:#f4ead6;padding:12px} .tag{font-weight:bold}
</style>
<h1>Concessions <small>— The Guano Age</small></h1>
<p><strong>Version 0.1.8 · Build 008</strong> · 1 human vs 2–4 bots · 1 concession and 2 boats each · no upkeep · finite reserves.</p>
<section><label>Players <select id="count"><option>3</option><option>4</option><option>5</option></select></label><button onclick="start()">New game</button><span id="status"></span></section>
<div id="app"></div><section><h2>Log</h2><div id="log"></div></section>
<script>
const names=['You (Yellow)','Blue','Green','Red','Purple'],colors=['#e5b83c','#5686ba','#4c956c','#c55b53','#926ca5'];
const ports=['Liverpool','Le Havre','Hamburg','Antwerp','Rotterdam','Bremen'];
let S=null,logs=[];
function note(t){logs.unshift('Round '+S.round+': '+t);document.getElementById('log').textContent=logs.slice(0,70).join('\n')}
function money(n){return '$'+n}
function start(){
const n=+document.getElementById('count').value;logs=[];
S={round:1,firstPlayer:0,phase:'produce',players:Array.from({length:n},(_,i)=>({name:names[i],cash:20,reserve:24,stock:0,boats:[{zone:0,cargo:0},{zone:0,cargo:0}]})),markets:ports.slice(0,n+1).map((name,i)=>({name,price:9+i*2})),offers:[],asks:[]};
note('Game begins. Each island has 24 tonnes. Ships hold 4 tonnes.');render()}
function priority(i){return (i-S.firstPlayer+S.players.length)%S.players.length}
function clockwise(){return S.players.map((_,j)=>(S.firstPlayer+j)%S.players.length)}
function cubes(n){return '●'.repeat(Math.min(n,12))+(n>12?' +'+(n-12):'')}
function options(arr){return arr.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('')}
function ships(p){return p.boats.map((b,i)=>'<span class="ship">⛵'+(i+1)+' '+['Peru','North Atlantic','Europe','South Atlantic'][b.zone]+' · '+b.cargo+'/4</span>').join('')}
function boardHTML(){
const order=[1,2,0,3],labels=['Peru · Islas','Atlántico Norte','Europa · Puertos','Atlántico Sur'];
return '<section><h2>Shipping Board</h2><p>Peru → North Atlantic → Europe → South Atlantic → Peru</p><div class="route-board">'+order.map(z=>'<div class="region"><h3>'+labels[z]+'</h3>'+S.players.flatMap((p,i)=>p.boats.map((b,k)=>b.zone===z?'<span class="vessel" style="border-color:'+colors[i]+'"><b>'+p.name.split(' ')[0]+' ⛵'+(k+1)+'</b><br>Guano '+b.cargo+'/4</span>':'')).join('')+'</div>').join('')+'</div></section>'
}
function portHTML(){
return '<section><h2>European Ports</h2><div class="port-grid">'+S.markets.map((m,j)=>'<div class="port"><b>'+m.name+'</b><p>$'+m.price+' / tonne</p>'+((S.euro&&S.phase==='europe')?S.euro.tokens.filter(t=>t.dest===j).map(t=>'<span class="marker" style="border-color:'+colors[t.i]+'">'+S.players[t.i].name.split(' ')[0]+' ?</span>').join(''):'')+'</div>').join('')+'</div></section>'
}
function euroUI(){
let e=S.euro,actor=e.participants[e.cursor];
if(actor===undefined)return '';
let first=e.pass===1,placed=e.tokens.filter(t=>t.i===0);
let allowed=S.markets.map((m,j)=>({m,j})).filter(x=>!placed.some(t=>t.dest===x.j));
return '<section><h2>4. Europe — Secret Manifests</h2><p>Each player places one face-down marker clockwise. On the second circuit, place the remaining marker at another port or pass. The symbols remain secret until all placements finish.</p><div class="turnbox"><b>Pass '+e.pass+' of 2</b> · '+S.players[actor].name+' to place'+(first?' (mandatory)':' (optional)')+'</div><p>Placed markers: '+e.tokens.length+' · Participating players: '+e.participants.length+'</p>'+
(actor===0?'<label>Port <select id="portChoice">'+allowed.map(x=>'<option value="'+x.j+'">'+x.m.name+' · $'+x.m.price+'</option>').join('')+'</select></label> <label>Marker <select id="markerChoice">'+(first?'<option value="real">Commitment</option><option value="bluff">Bluff</option>':(placed[0]&&placed[0].type==='real'?'<option value="bluff">Bluff</option>':'<option value="real">Commitment</option>'))+'</select></label><button onclick="euroHuman()">Place face down</button>'+(first?'':'<button onclick="euroPass()">Pass</button>'):'<button onclick="advanceEurope()">Continue</button>')+'</section>'
}
function render(){
if(!S)return;let p=S.players[0],a=document.getElementById('app');
document.getElementById('status').textContent=' Round '+S.round+' · '+S.phase;
let out='<section><h2>Turn Order</h2><p><b>First Player marker:</b> <span style="color:'+colors[S.firstPlayer]+';font-weight:bold">◆ '+S.players[S.firstPlayer].name+'</span> · Clockwise: '+clockwise().map(i=>(i===S.firstPlayer?'◆ ':'')+S.players[i].name).join(' → ')+'</p><small>Peru seller ties: earlier in turn order first. Buyer ties: later in turn order first. Marker advances after Europe resolves.</small></section><section><h2>Merchant Houses</h2><div class="grid">'+S.players.map((x,i)=>'<div class="player" style="border-top:5px solid '+colors[i]+'"><b>'+x.name+'</b><p>Cash '+money(x.cash)+' · Island reserve '+x.reserve+' · Peru stock '+x.stock+'</p>'+ships(x)+'</div>').join('')+'</div></section>';
out+=boardHTML();out+=portHTML();
if(S.phase==='produce')out+='<section><h2>1. Extract Guano</h2><p>Choose how much to extract (maximum 4 tonnes per round). Extracted guano remains in Peru until purchased.</p><input id="extract" type="number" min="0" max="'+Math.min(4,p.reserve)+'" value="'+Math.min(3,p.reserve)+'"><button onclick="produce()">Extract and continue</button></section>';
if(S.phase==='peru')out+='<section><h2>2. Peru Market</h2><p>Set a minimum selling price (Precio) and an offer to buy (Oferta). Buyers pay their own offer. Highest offer resolves against lowest ask. Equal values use turn order; later buyers resolve first.</p><label>Precio <input id="ask" type="number" min="1" max="25" value="7"></label><label>Oferta <input id="bid" type="number" min="1" max="25" value="10"></label><button onclick="peru()">Reveal and clear market</button></section>';
if(S.phase==='marketResolve'){let m=S.market;
out+='<section><h2>Peru Market — Live Resolution</h2><p>Cheapest sellers on the left; highest buying offers first on the right. Buyers pay their offered price.</p><div class="grid"><div><h3>Islands · Precio</h3>'+m.asks.map(x=>'<div class="player" style="border-left:6px solid '+colors[x.i]+'"><b>'+S.players[x.i].name+'</b> · minimum $'+x.price+' / tonne<br>'+cubes(x.left)+' <b>'+x.left+' tonnes</b></div>').join('')+'</div><div><h3>Ships · Oferta</h3>'+m.bids.map((x,i)=>'<div class="player" style="border-left:6px solid '+colors[x.i]+';'+(i===m.cursor?'background:#f8e1a4':'')+'"><b>'+S.players[x.i].name+' Boat '+(x.k+1)+'</b> · offer $'+x.price+' / tonne<br>Loaded '+S.players[x.i].boats[x.k].cargo+'/4 tonnes'+(i===m.cursor?' · <b>NEXT</b>':'')+'</div>').join('')+'</div></div><p><b>Next:</b> '+marketNextText()+'</p><button onclick="marketStep()">Resolve next offer</button><button onclick="marketAll()">Resolve all</button><h3>Transactions</h3>'+m.history.map(x=>'<p>'+x+'</p>').join('')+'</section>'}
if(S.phase==='sail')out+='<section><h2>3. Departures</h2><p>Boats move one sea region each round. A boat in Peru can stay to load, or depart. Boats in Europe unload through the port market.</p>'+p.boats.map((b,i)=>'<p>Boat '+(i+1)+' ('+b.cargo+'/4) '+(b.zone===0?'<label><input type="checkbox" id="depart'+i+'" '+(b.cargo?'checked':'')+'> Depart Peru</label>':'Moves onward automatically')+'</p>').join('')+'<button onclick="sail()">Move boats</button></section>';
if(S.phase==='europe')out+=euroUI();
if(S.phase==='end')out+='<section><h2>Game over</h2><p>Only one island still has guano in reserve. Highest cash wins.</p><h3>'+[...S.players].sort((a,b)=>b.cash-a.cash).map(x=>x.name+': '+money(x.cash)).join(' · ')+'</h3><button onclick="start()">Play again</button></section>';
a.innerHTML=out;
}
function produce(){
let p=S.players[0],v=Math.max(0,Math.min(4,p.reserve,Math.floor(+document.getElementById('extract').value||0)));p.reserve-=v;p.stock+=v;
S.players.slice(1).forEach(q=>{let x=Math.min(q.reserve,q.stock>5?1:2+Math.floor(Math.random()*3));q.reserve-=x;q.stock+=x});
note('Extraction: '+S.players.map(q=>q.name+' '+q.stock+' available').join(', '));S.phase='peru';render()}
function botAsk(q){
let availableBoats=S.players.reduce((n,p)=>n+p.boats.filter(b=>b.zone===0&&b.cargo<4).length,0);
let pressure=(q.cash<12?4:q.cash<25?2:0)+(q.stock>=7?3:q.stock>=4?1:0);
if(availableBoats===0)return 9;
let price=10-pressure;
if(q.stock<=2&&q.cash>=30)price+=2;
return Math.max(1,Math.min(17,price));
}
function botBid(q){
let free=q.boats.reduce((n,b)=>n+(b.zone===0?4-b.cargo:0),0);
if(free===0||q.cash<2)return 1;
let bestEuropean=Math.max(...S.markets.map(m=>m.price));
let affordable=Math.floor(q.cash/Math.min(4,free));
let target=Math.min(bestEuropean-4,affordable);
if(q.cash<15)target=Math.min(target,6);
return Math.max(1,Math.min(18,target));
}
function peru(){
let ask=Math.max(1,+document.getElementById('ask').value||1),bid=Math.max(1,+document.getElementById('bid').value||1);
let asks=S.players.map((q,i)=>({i,price:i?botAsk(q):ask,left:q.stock})).filter(x=>x.left>0).sort((a,b)=>a.price-b.price||priority(a.i)-priority(b.i));
let bids=[];S.players.forEach((q,i)=>q.boats.forEach((b,k)=>{if(b.zone===0&&b.cargo<4)bids.push({i,k,price:i?botBid(q):bid})}));
bids.sort((a,b)=>b.price-a.price||priority(b.i)-priority(a.i));
S.market={asks,bids,cursor:0,history:[]};S.phase='marketResolve';note('Peru offers revealed: '+asks.map(x=>S.players[x.i].name+' asks $'+x.price).join('; '));render()
}
function marketNextText(){
let m=S.market,b=m.bids[m.cursor];if(!b)return 'Market complete.';
let s=m.asks.find(x=>x.left>0&&x.price<=b.price);
if(!s)return S.players[b.i].name+' Boat '+(b.k+1)+' has no eligible seller at $'+b.price+'.';
return S.players[b.i].name+' Boat '+(b.k+1)+' offers $'+b.price+'; cheapest eligible seller is '+S.players[s.i].name+' asking $'+s.price+'.'
}
function marketStep(){
let m=S.market,b=m.bids[m.cursor];
if(!b){S.phase='sail';render();return}
let buyer=S.players[b.i],boat=buyer.boats[b.k],s=m.asks.find(x=>x.left>0&&x.price<=b.price);
let qty=s?Math.min(s.left,4-boat.cargo,Math.floor(buyer.cash/b.price)):0;
if(qty>0){let seller=S.players[s.i];buyer.cash-=qty*b.price;seller.cash+=qty*b.price;seller.stock-=qty;s.left-=qty;boat.cargo+=qty;
let line=buyer.name+' Boat '+(b.k+1)+' buys '+qty+' tonnes from '+seller.name+' at $'+b.price+' = $'+qty*b.price+'.';m.history.unshift(line);note(line)}
else m.history.unshift(buyer.name+' Boat '+(b.k+1)+' cannot purchase at $'+b.price+'.');
m.cursor++;
if(m.cursor>=m.bids.length){note('Peru market cleared.');S.phase='sail'}render()
}
function marketAll(){while(S.phase==='marketResolve')marketStep()}
function initEurope(){
let participants=clockwise().filter(i=>S.players[i].boats.some(b=>b.zone===2&&b.cargo>0));
if(!participants.length){finishRound();return}
S.euro={participants,cursor:0,pass:1,tokens:[]};S.phase='europe';advanceEurope()
}
function advanceEurope(){
let e=S.euro;if(!e)return;
if(e.cursor>=e.participants.length){if(e.pass===1){e.pass=2;e.cursor=0}else{resolveEurope();return}}
let i=e.participants[e.cursor];
if(i!==0){botPlace(i);return}
render()
}
function botPlace(i){
let e=S.euro,existing=e.tokens.filter(t=>t.i===i);
if(e.pass===2&&Math.random()<.22){e.cursor++;advanceEurope();return}
let available=S.markets.map((m,j)=>j).filter(j=>!existing.some(t=>t.dest===j));
let sorted=available.sort((a,b)=>S.markets[b].price-S.markets[a].price);
let dest=sorted[Math.min(sorted.length-1,Math.floor(Math.random()*Math.min(3,sorted.length)))];
let type=e.pass===1?(Math.random()<.7?'real':'bluff'):(existing[0].type==='real'?'bluff':'real');
e.tokens.push({i,dest,type});note(S.players[i].name+' places a face-down marker at '+S.markets[dest].name);
e.cursor++;advanceEurope()
}
function euroHuman(){
let dest=+document.getElementById('portChoice').value,type=document.getElementById('markerChoice').value;
if(S.euro.tokens.some(t=>t.i===0&&t.dest===dest)){alert('Choose a different port.');return}
S.euro.tokens.push({i:0,dest,type});note('Yellow places a face-down marker at '+S.markets[dest].name);
S.euro.cursor++;advanceEurope()
}
function euroPass(){if(S.euro.pass!==2)return;note('Yellow passes on second marker.');S.euro.cursor++;advanceEurope()}
function resolveEurope(){
let e=S.euro,deliveries=[];
note('Manifests revealed: '+e.tokens.map(t=>S.players[t.i].name+' '+(t.type==='real'?'COMMITMENT':'BLUFF')+' at '+S.markets[t.dest].name).join('; '));
e.participants.forEach(i=>{
let real=e.tokens.find(t=>t.i===i&&t.type==='real');
if(!real){note(S.players[i].name+' placed only a bluff; cargo waits in Europe.');return}
S.players[i].boats.filter(b=>b.zone===2&&b.cargo>0).forEach(b=>deliveries.push({i,b,dest:real.dest}))
});
S.markets.forEach((m,j)=>{
let ds=deliveries.filter(d=>d.dest===j),total=ds.reduce((sum,d)=>sum+d.b.cargo,0);
if(!ds.length){m.price=Math.min(25,m.price+1);return}
let listed=m.price;
let payout=Math.max(1,listed-total);
note(m.name+': listed $'+listed+' minus '+total+' tonnes = $'+payout+' per tonne.');
ds.forEach(d=>{let gain=payout*d.b.cargo;S.players[d.i].cash+=gain;note(S.players[d.i].name+' sells '+d.b.cargo+' tonnes at '+m.name+' for $'+gain+' ($'+payout+'/tonne)');d.b.cargo=0;d.b.zone=3});
m.price=payout
});
S.euro=null;finishRound()
}
function finishRound(){
S.firstPlayer=(S.firstPlayer+1)%S.players.length;
note('First Player marker advances to '+S.players[S.firstPlayer].name+'.');
let active=S.players.filter(p=>p.reserve>0);
if(active.length<=1){S.phase='end';note('Guano Age ends.')}
else{S.round++;S.phase='produce'}
render()
}
function sail(){
S.players.forEach((p,i)=>p.boats.forEach((b,k)=>{if(b.zone===0){let depart=i===0?document.getElementById('depart'+k).checked:b.cargo>=3;if(depart&&b.cargo)b.zone=1}else if(b.zone===1)b.zone=2;else if(b.zone===3)b.zone=0}));
note('Ships advance. '+S.players.reduce((a,p)=>a+p.boats.filter(b=>b.zone===2).length,0)+' boats in Europe.');initEurope()}
start();
</script></html>
