<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concessions: The Guano Age — v0.2.0</title>
<style>
body{font:15px Georgia,serif;background:#eee4ce;color:#32291e;max-width:1150px;margin:auto;padding:22px}
h1,h2{color:#583b22}button,select,input{font:inherit;padding:7px;margin:3px;border:1px solid #947b58;border-radius:4px;background:#fffaf0}
button{cursor:pointer;background:#d9c29a}button:disabled{opacity:.45}section{background:#fff9e9;border:1px solid #c9b28a;padding:14px;margin:12px 0;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.player{padding:12px;border:2px solid #b6a17e;background:#fffdf6}
small{color:#685b49}.ship{display:inline-block;padding:5px;background:#e8dcc4;margin:3px;border-radius:4px}
.route-board{display:grid;grid-template-columns:1fr 1fr;gap:9px;background:#b7c9c4;padding:10px;border:4px double #75634a;border-radius:9px}.region{background:#f5edda;border:2px solid #b8a17b;border-radius:8px;min-height:112px;padding:10px}.region h3{margin:0 0 7px}.vessel{display:inline-block;background:#fffaf0;border:2px solid;border-radius:8px;padding:6px;margin:3px;font-size:13px}.port-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.port{border:2px solid #c5af88;border-radius:7px;padding:10px;background:#f8f0df}.marker{display:inline-block;border:2px solid;border-radius:18px;padding:5px 8px;margin:3px;background:#fff9e7;font-weight:bold}.turnbox{background:#e9d5a7;padding:10px;border-radius:6px;margin:10px 0}#log{max-height:240px;overflow:auto;white-space:pre-line;background:#f4ead6;padding:12px} .tag{font-weight:bold}
.manifest-card{border-top-width:5px}.manifest-card p{margin:8px 0}.manifest-card .payout{font-size:18px;background:#e5efdf;padding:9px;border-radius:5px}.manifest-card .held{background:#f2e1c7}.manifest-token{display:inline-block;padding:3px 7px;border-radius:4px;font-weight:bold;background:#e7f0df}.manifest-token.bluff{background:#f4d9bc}.euro-totals{background:#eee0bd;padding:10px;border-radius:6px;margin:12px 0}
</style>
<h1>Concessions <small>— The Guano Age</small></h1>
<p><strong>Version 0.2.0 · Build 015</strong> · 1 human vs 2–4 bots · 1 concession and 2 boats each · no upkeep · finite reserves.</p>
<section><label>Players <select id="count"><option>3</option><option>4</option><option>5</option></select></label><button onclick="start()">New game</button><span id="status"></span></section>
<div id="app"></div><section><h2>Log</h2><div id="log"></div></section>
<script>
const names=['You (Yellow)','Blue','Green','Red','Purple'],colors=['#e5b83c','#5686ba','#4c956c','#c55b53','#926ca5'];
const ports=['Liverpool','Le Havre','Hamburg','Antwerp','Rotterdam','Bremen'];
let S=null,logs=[];
function note(t){logs.unshift('Round '+S.round+': '+t);document.getElementById('log').textContent=logs.slice(0,70).join('\n')}
function money(n){return '$'+n}
function start(){
const n=+document.getElementById('count').value;logs=[];
S={round:1,firstPlayer:0,finalMoves:0,exhausted:false,docksClosed:false,commitments:null,phase:'produce',players:Array.from({length:n},(_,i)=>({name:names[i],cash:20,reserve:24,stock:0,boats:[{zone:0,cargo:0},{zone:0,cargo:0}]})),markets:ports.slice(0,n).map((name,i)=>({name,price:9+i*2,fill:0})),offers:[],asks:[]};
note('Game begins. Concession reserves are private. Ships hold 4 tonnes.');render()}
function priority(i){return (i-S.firstPlayer+S.players.length)%S.players.length}
function clockwise(){return S.players.map((_,j)=>(S.firstPlayer+j)%S.players.length)}
function cubes(n){return '●'.repeat(Math.min(n,12))+(n>12?' +'+(n-12):'')}
function options(arr){return arr.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('')}
function ships(p){return p.boats.map((b,i)=>'<span class="ship">⛵'+(i+1)+' '+['Peru','North Atlantic','Europe','South Atlantic'][b.zone]+' · '+b.cargo+'/4</span>').join('')}
function boardHTML(){
const order=[1,2,0,3],labels=['Peru · Islas','Atlántico Norte','Europa · Puertos','Atlántico Sur'];
return '<section><h2>Shipping Board</h2><p>Peru → North Atlantic → Europe → South Atlantic → Peru</p><div class="route-board">'+order.map(z=>'<div class="region"><h3>'+labels[z]+'</h3>'+S.players.flatMap((p,i)=>p.boats.map((b,k)=>b.zone===z?'<span class="vessel" style="border-color:'+colors[i]+'"><b>'+p.name.split(' ')[0]+' ⛵'+(k+1)+'</b><br>Guano '+b.cargo+'/4</span>':'')).join('')+'</div>').join('')+'</div></section>'
}
function portHTML(){
return '<section><h2>European Ports</h2><p>Each price level has two tonne spaces. A filled space persists between rounds; when the First Player marker advances, each port consumes two tonnes and its price rises by $1.</p><div class="port-grid">'+S.markets.map((m,j)=>'<div class="port"><b>'+m.name+'</b><p>$'+m.price+' / tonne</p><small>Current price level: '+(m.fill?'● ○':'○ ○')+' · '+m.fill+'/2 spaces filled</small><div>'+((S.euro&&S.phase==='europe')?S.euro.tokens.filter(t=>t.dest===j).map(t=>'<span class="marker" style="border-color:'+colors[t.i]+'">'+S.players[t.i].name.split(' ')[0]+' ⛵'+(t.k+1)+' ?</span>').join(''):'')+'</div></div>').join('')+'</div></section>'
}
function euroUI(){
let e=S.euro,turn=e.turns[e.cursor];if(!turn)return '';
let i=turn.i,k=turn.k,placed=e.tokens.filter(t=>t.i===i&&t.k===k);
let allowed=S.markets.map((m,j)=>({m,j})).filter(x=>!placed.some(t=>t.dest===x.j));
let typeOptions=placed.length?(placed[0].type==='real'?'<option value="bluff">Bluff</option>':'<option value="real">Commitment</option>'):'<option value="real">Commitment</option><option value="bluff">Bluff</option>';
return '<section><h2>4. Europe — Ship Manifests</h2><p>Each loaded boat has its own commitment and optional bluff. Each circuit goes clockwise, one marker per boat. All markers remain face down until reveal.</p><div class="turnbox"><b>Pass '+e.pass+' of 2</b> · '+S.players[i].name+' · Boat '+(k+1)+' ('+S.players[i].boats[k].cargo+' tonnes)'+(e.pass===2?' · optional':'')+'</div><p>Face-down markers placed: '+e.tokens.length+'</p>'+
 (i===0?'<label>Port <select id="portChoice">'+allowed.map(x=>'<option value="'+x.j+'">'+x.m.name+' · $'+x.m.price+'</option>').join('')+'</select></label><label>Marker <select id="markerChoice">'+typeOptions+'</select></label><button onclick="euroHuman()">Place face down</button>'+(e.pass===2&&placed.some(t=>t.type==='real')?'<button onclick="euroPass()">Pass</button>':''):'<button onclick="advanceEurope()">Continue</button>')+'</section>'
}
function europeResultsHTML(){
 let report=S.euroReport;if(!report)return '';
 let totals=S.players.map((p,i)=>({name:p.name,income:report.boats.filter(b=>b.i===i).reduce((sum,b)=>sum+b.income,0)}));
 let clearings=report.ports.map(m=>'<div class="port"><b>'+S.markets[m.dest].name+'</b><p>'+m.total+' tonnes unloaded</p><small>Listed $'+m.listed+' → clearing $'+m.payout+'/tonne</small></div>').join('');
 let cards=report.boats.map(b=>{
 let destination=b.commit===null?'No commitment':S.markets[b.commit].name;
 let bluff=b.bluff===null?'None':S.markets[b.bluff].name;
 let outcome=b.commit===null?'<p class="payout held"><b>No sale</b> · '+b.cargo+' tonnes remain aboard in Europe.</p>':'<p class="payout">Sold <b>'+b.cargo+' tonnes</b> × $'+b.price+'/tonne = <b>$'+b.income+'</b></p>';
 return '<div class="player manifest-card" style="border-top-color:'+colors[b.i]+'"><b>'+S.players[b.i].name+' · Boat '+(b.k+1)+'</b><p>Cargo arriving: <b>'+b.cargo+'/4 tonnes</b></p><p><span class="manifest-token">COMMIT</span> '+destination+'</p><p><span class="manifest-token bluff">BLUFF</span> '+bluff+'</p>'+outcome+'</div>';
 }).join('');
 return '<section><h2>Europe — Round '+report.round+' Results</h2><p>All face-down markers are revealed. Each boat shows its actual commitment, its bluff (if any), and the money earned at the shared port clearing price.</p><div class="euro-totals"><b>European sale revenue:</b> '+totals.map(t=>t.name+' <b>$'+t.income+'</b>').join(' · ')+'</div>'+(clearings?'<h3>Port clearing prices</h3><div class="port-grid">'+clearings+'</div>':'')+'<h3>Boat-by-boat manifests</h3><div class="grid">'+cards+'</div>'+(S.phase==='euroResults'?'<p><button onclick="finishRound()">Continue to next round</button></p>':'')+'</section>';
}

function render(){
if(!S)return;let p=S.players[0],a=document.getElementById('app');
document.getElementById('status').textContent=' Round '+S.round+' · '+S.phase;
let out='<section><h2>Turn Order</h2><p><b>First Player marker:</b> <span style="color:'+colors[S.firstPlayer]+';font-weight:bold">◆ '+S.players[S.firstPlayer].name+'</span> · Clockwise: '+clockwise().map(i=>(i===S.firstPlayer?'◆ ':'')+S.players[i].name).join(' → ')+'</p><small>Peru seller ties: earlier in turn order first. Buyer ties: later in turn order first. Marker advances after Europe resolves.</small></section><section><h2>Merchant Houses</h2><div class="grid">'+S.players.map((x,i)=>'<div class="player" style="border-top:5px solid '+colors[i]+'"><b>'+x.name+'</b><p>Cash '+money(x.cash)+' · Island reserve '+(S.exhausted?'Exhausted':i===0?x.reserve:'Hidden')+' · Peru stock '+x.stock+'</p>'+ships(x)+'</div>').join('')+'</div></section>';
out+=boardHTML();out+=portHTML();
if(S.phase==='produce')out+='<section><h2>1. Commit Extraction</h2><p>Secretly choose 0–4 tonnes to extract (up to your remaining reserve). Every player holds out a closed hand; all quantities are revealed together. If the total is 2 tonnes or fewer, extraction ends permanently.</p><input id="extract" type="number" min="0" max="'+Math.min(4,p.reserve)+'" value="'+Math.min(3,p.reserve)+'"><button onclick="produce()">Hold out your hand</button></section>';
if(S.phase==='extractReveal')out+='<section><h2>1. Reveal Extraction</h2><p>All '+S.players.length+' players have committed. Their hands stay closed until the simultaneous reveal.</p><div class="grid">'+S.players.map((x,i)=>'<div class="player" style="border-left:5px solid '+colors[i]+'"><b>'+x.name+'</b> · ✊ Committed</div>').join('')+'</div><button onclick="revealExtraction()">Reveal all hands</button></section>';
if(S.phase==='peru'){let c=marketConditions();out+='<section><h2>2. Peru Market</h2><p><b>On the docks:</b> '+c.supply+' tonnes from '+c.sellers+' sellers · '+c.capacity+' tonnes of open capacity across '+c.buyers+' boats.</p><p>Set a minimum selling price (Precio) and an offer to buy (Oferta). Buyers pay their own offer. Highest offer resolves against lowest ask. Equal values use turn order; later buyers resolve first.</p><label>Precio <input id="ask" type="number" min="1" max="25" value="7"></label><label>Oferta <input id="bid" type="number" min="1" max="25" value="10"></label><button onclick="peru()">Reveal and clear market</button></section>'}
if(S.phase==='marketResolve'){let m=S.market;
out+='<section><h2>Peru Market — Live Resolution</h2><p>Cheapest sellers on the left; highest buying offers first on the right. Buyers pay their offered price.</p><div class="grid"><div><h3>Islands · Precio</h3>'+m.asks.map(x=>'<div class="player" style="border-left:6px solid '+colors[x.i]+'"><b>'+S.players[x.i].name+'</b> · minimum $'+x.price+' / tonne<br>'+cubes(x.left)+' <b>'+x.left+' tonnes</b></div>').join('')+'</div><div><h3>Ships · Oferta</h3>'+m.bids.map((x,i)=>'<div class="player" style="border-left:6px solid '+colors[x.i]+';'+(i===m.cursor?'background:#f8e1a4':'')+'"><b>'+S.players[x.i].name+' Boat '+(x.k+1)+'</b> · offer $'+x.price+' / tonne<br>Loaded '+S.players[x.i].boats[x.k].cargo+'/4 tonnes'+(i===m.cursor?' · <b>NEXT</b>':'')+'</div>').join('')+'</div></div><p><b>Next:</b> '+marketNextText()+'</p><button onclick="marketStep()">Resolve next offer</button><button onclick="marketAll()">Resolve all</button><h3>Transactions</h3>'+m.history.map(x=>'<p>'+x+'</p>').join('')+'</section>'}
if(S.phase==='finalSail')out+='<section><h2>Final Voyage · Movement '+(3-S.finalMoves)+' of 2</h2><p>The docks are closed. Loaded boats in Peru depart automatically; boats at sea advance toward Europe. After this movement, the European market opens.</p><button onclick="sail()">Advance final voyage</button></section>';
if(S.phase==='sail')out+='<section><h2>3. Departures</h2><p>'+(S.docksClosed?'Docks closed: every loaded boat departs automatically for its final voyage.':'Boats move one sea region each round. A boat in Peru can stay to load, or depart. Boats in Europe unload through the port market.')+'</p>'+(S.docksClosed?'':p.boats.map((b,i)=>'<p>Boat '+(i+1)+' ('+b.cargo+'/4) '+(b.zone===0?'<label><input type="checkbox" id="depart'+i+'" '+(b.cargo?'checked':'')+'> Depart Peru</label>':'Moves onward automatically')+'</p>').join(''))+'<button onclick="sail()">Move boats</button></section>';
if(S.phase==='europe')out+=euroUI();
 if(S.phase==='euroResults'||S.phase==='end'&&S.euroReport)out+=europeResultsHTML();
if(S.exhausted)out+='<section><b>Reserves exhausted.</b> '+(S.docksClosed?'Island docks closed. '+S.finalMoves+' final ship movement(s) remaining.':'No more extraction. Existing dock stock can still be traded until a Peru market has no sales.')+'</section>';
if(S.phase==='end')out+='<section><h2>Game over</h2><p>The docks are closed and the final European sales have resolved. Highest cash wins.</p><h3>'+[...S.players].sort((a,b)=>b.cash-a.cash).map(x=>x.name+': '+money(x.cash)).join(' · ')+'</h3><button onclick="start()">Play again</button></section>';
a.innerHTML=out;
}
function produce(){
let p=S.players[0],v=Math.max(0,Math.min(4,p.reserve,Math.floor(+document.getElementById('extract').value||0)));
S.commitments=[v,...S.players.slice(1).map(q=>Math.min(q.reserve,q.stock>5?1:2+Math.floor(Math.random()*3)))];
S.phase='extractReveal';render()}
function revealExtraction(){
if(S.phase!=='extractReveal'||!S.commitments)return;
let total=0;
S.players.forEach((q,i)=>{let v=S.commitments[i];q.reserve-=v;q.stock+=v;total+=v});
note('Extraction revealed: '+S.players.map((q,i)=>q.name+' '+S.commitments[i]+' tonnes').join('; ')+'. Total '+total+' tonnes.');
S.commitments=null;
if(total<=2){S.exhausted=true;note('Reserves exhausted: total extraction was '+total+' tonnes (2 or fewer). No further extraction; existing island docks remain open until a round has no Peru sales.')}
S.phase='peru';render()}
function marketConditions(){
let supply=S.players.reduce((n,p)=>n+p.stock,0);
let sellers=S.players.filter(p=>p.stock>0).length;
let openBoats=S.players.flatMap(p=>p.boats.filter(b=>b.zone===0&&b.cargo<4).map(b=>({cash:p.cash,free:4-b.cargo})));
let capacity=openBoats.reduce((n,b)=>n+b.free,0),buyers=openBoats.length;
// Both tonnes and the number of competing houses/ships matter. All of these are public before offers are revealed.
let volumePressure=Math.log2((supply+2)/(capacity+2));
let competitionPressure=Math.log2((sellers+1)/(buyers+1));
let pressure=Math.max(-2,Math.min(2,volumePressure*.75+competitionPressure*.25));
// A high reserve price is worthless when the boats can't afford even a typical load.
let budgets=openBoats.map(b=>Math.floor(b.cash/Math.min(4,b.free))).sort((a,b)=>a-b);
let typicalBudget=budgets.length?budgets[Math.floor((budgets.length-1)/2)]:0;
let bestEuropean=Math.max(...S.markets.map(m=>m.price));
// Two tonnes occupy each price level. A half-filled level makes the next tonne matter.
let existingCargo=Math.max(0,...openBoats.map(b=>4-b.free));
let expectedDelivery=Math.min(4,Math.max(1,supply+existingCargo));
let bestExpectedPayout=Math.max(...S.markets.map(m=>Math.max(1,m.price-Math.floor((m.fill+expectedDelivery)/2))));
let maxPurchasePrice=Math.max(1,bestExpectedPayout-1); // Aim for $1 profit; all offers have a $1 floor.
return {supply,sellers,capacity,buyers,pressure,typicalBudget,bestEuropean,expectedDelivery,maxPurchasePrice};
}
function botAsk(q,c){
if(c.buyers===0)return Math.min(9,c.maxPurchasePrice);
let urgency=(q.cash<12?2:q.cash<25?1:0)+(q.stock>=7?2:q.stock>=4?1:0);
let price=11-Math.round(c.pressure*3)-urgency;
// Sellers with more stock than their likely share of the boats undercut more sharply in a glut.
if(c.pressure>.35&&c.sellers>c.buyers&&q.stock>c.capacity/c.sellers)price--;
if(q.stock<=2&&q.cash>=30)price+=2;
// Even a rich buyer will not sensibly pay more than the projected European resale profit allows.
let competitiveCeiling=Math.max(1,c.maxPurchasePrice-Math.max(0,Math.round(c.pressure*3)));
price=Math.min(price,Math.max(1,c.typicalBudget),competitiveCeiling);
return Math.max(1,Math.min(25,price));
}
function botBid(q,c){
let free=q.boats.reduce((n,b)=>n+(b.zone===0?4-b.cargo:0),0);
if(free===0||q.cash<1)return 1;
let affordable=Math.max(1,Math.floor(q.cash/Math.min(4,free)));
// Abundant dock stock lets buyers bid less; scarce stock makes them compete, subject to cash and resale margins.
let target=Math.min(12,c.maxPurchasePrice)-Math.round(c.pressure*4);
return Math.max(1,Math.min(25,c.maxPurchasePrice,affordable,target));
}
function peru(){
let ask=Math.max(1,+document.getElementById('ask').value||1),bid=Math.max(1,+document.getElementById('bid').value||1);
let conditions=marketConditions();
let asks=S.players.map((q,i)=>({i,price:i?botAsk(q,conditions):ask,left:q.stock})).filter(x=>x.left>0).sort((a,b)=>a.price-b.price||priority(a.i)-priority(b.i));
let bids=[];S.players.forEach((q,i)=>q.boats.forEach((b,k)=>{if(b.zone===0&&b.cargo<4)bids.push({i,k,price:i?botBid(q,conditions):bid})}));
bids.sort((a,b)=>b.price-a.price||priority(b.i)-priority(a.i));
S.market={asks,bids,cursor:0,sales:0,history:[]};S.phase='marketResolve';note('Peru offers revealed: '+asks.map(x=>S.players[x.i].name+' asks $'+x.price).join('; '));render()
}
function marketNextText(){
let m=S.market,b=m.bids[m.cursor];if(!b)return 'Market complete.';
let s=m.asks.find(x=>x.left>0&&x.price<=b.price);
if(!s)return S.players[b.i].name+' Boat '+(b.k+1)+' has no eligible seller at $'+b.price+'.';
return S.players[b.i].name+' Boat '+(b.k+1)+' offers $'+b.price+'; cheapest eligible seller is '+S.players[s.i].name+' asking $'+s.price+'.'
}
function marketStep(){
let m=S.market,b=m.bids[m.cursor];
if(!b){finishMarket();return}
let buyer=S.players[b.i],boat=buyer.boats[b.k],s=m.asks.find(x=>x.left>0&&x.price<=b.price);
let qty=s?Math.min(s.left,4-boat.cargo,Math.floor(buyer.cash/b.price)):0;
if(qty>0){let seller=S.players[s.i];buyer.cash-=qty*b.price;seller.cash+=qty*b.price;seller.stock-=qty;s.left-=qty;boat.cargo+=qty;
 m.sales++;
let line=buyer.name+' Boat '+(b.k+1)+' buys '+qty+' tonnes from '+seller.name+' at $'+b.price+' = $'+qty*b.price+'.';m.history.unshift(line);note(line)}
else m.history.unshift(buyer.name+' Boat '+(b.k+1)+' cannot purchase at $'+b.price+'.');
m.cursor++;
if(m.cursor>=m.bids.length){finishMarket();return}render()
}
function finishMarket(){
note('Peru market cleared.');
if(S.exhausted&&!S.docksClosed&&S.market.sales===0){
 S.docksClosed=true;S.finalMoves=2;
 note('No guano sold in Peru this round. All island docks close; remaining dock stock can no longer be sold. Two final ship movements begin.');
}
S.phase='sail';render()
}
function marketAll(){while(S.phase==='marketResolve')marketStep()}
function initEurope(){
// Each player places only one marker before the next player, even with two loaded boats.
let turns=[];for(let k=0;k<2;k++)clockwise().forEach(i=>{let b=S.players[i].boats[k];if(b&&b.zone===2&&b.cargo>0)turns.push({i,k})});
if(!turns.length){note('No ships in European ports.');finishRound();return}
S.euro={turns,cursor:0,pass:1,tokens:[]};S.phase='europe';advanceEurope()
}
function advanceEurope(){
let e=S.euro;if(!e)return;
if(e.cursor>=e.turns.length){if(e.pass===1){e.pass=2;e.cursor=0}else{resolveEurope();return}}
let turn=e.turns[e.cursor];if(turn.i!==0){botPlace(turn.i,turn.k);return}render()
}
function botPlace(i,k){
let e=S.euro,existing=e.tokens.filter(t=>t.i===i&&t.k===k);
if(e.pass===2&&existing.some(t=>t.type==='real')&&Math.random()<.22){e.cursor++;advanceEurope();return}
let available=S.markets.map((m,j)=>j).filter(j=>!existing.some(t=>t.dest===j));
let sorted=available.sort((a,b)=>{
let cargo=S.players[i].boats[k].cargo;
return (S.markets[b].price-Math.floor((S.markets[b].fill+cargo)/2))-(S.markets[a].price-Math.floor((S.markets[a].fill+cargo)/2));
});
let dest=sorted[Math.min(sorted.length-1,Math.floor(Math.random()*Math.min(3,sorted.length)))];
let type=e.pass===1?(Math.random()<.7?'real':'bluff'):(existing[0].type==='real'?'bluff':'real');
e.tokens.push({i,k,dest,type});note(S.players[i].name+' Boat '+(k+1)+' places a face-down marker at '+S.markets[dest].name);
e.cursor++;advanceEurope()
}
function euroHuman(){
let e=S.euro,turn=e.turns[e.cursor],dest=+document.getElementById('portChoice').value,type=document.getElementById('markerChoice').value;
if(e.tokens.some(t=>t.i===turn.i&&t.k===turn.k&&t.dest===dest)){alert('This boat must use a different port for its second marker.');return}
e.tokens.push({i:turn.i,k:turn.k,dest,type});note('Yellow Boat '+(turn.k+1)+' places a face-down marker at '+S.markets[dest].name);
e.cursor++;advanceEurope()
}
function euroPass(){if(S.euro.pass!==2)return;let t=S.euro.turns[S.euro.cursor];if(!S.euro.tokens.some(x=>x.i===t.i&&x.k===t.k&&x.type==='real'))return;note('Yellow Boat '+(t.k+1)+' passes on second marker.');S.euro.cursor++;advanceEurope()}
function fillPort(m,tonnes){
let filled=m.fill+tonnes;
m.price=Math.max(1,m.price-Math.floor(filled/2));
m.fill=filled%2; // Carry a single occupied space into the next sale, even across rounds.
return m.price;
}
function resolveEurope(){
let e=S.euro,deliveries=[];
note('Manifests revealed: '+e.tokens.map(t=>S.players[t.i].name+' Boat '+(t.k+1)+' '+(t.type==='real'?'COMMITMENT':'BLUFF')+' at '+S.markets[t.dest].name).join('; '));
let boats=e.turns.map(t=>{
let real=e.tokens.find(x=>x.i===t.i&&x.k===t.k&&x.type==='real');
 let bluff=e.tokens.find(x=>x.i===t.i&&x.k===t.k&&x.type==='bluff');
let boat=S.players[t.i].boats[t.k];
 let result={i:t.i,k:t.k,cargo:boat.cargo,commit:real?real.dest:null,bluff:bluff?bluff.dest:null,price:0,income:0};
 if(!real){note(S.players[t.i].name+' Boat '+(t.k+1)+' placed only a bluff; cargo waits in Europe.');return result}
 deliveries.push({i:t.i,b:boat,dest:real.dest,result});return result;
});
let portResults=[];
S.markets.forEach((m,j)=>{
let ds=deliveries.filter(d=>d.dest===j),total=ds.reduce((sum,d)=>sum+d.b.cargo,0);
if(!ds.length)return;
let listed=m.price,previousFill=m.fill,payout=fillPort(m,total);
 portResults.push({dest:j,listed,previousFill,total,payout});
note(m.name+': listed $'+listed+', '+total+' tonnes unloaded into two-tonne price levels ('+previousFill+' previously filled) = $'+payout+' per tonne.');
 ds.forEach(d=>{let gain=payout*d.b.cargo;d.result.price=payout;d.result.income=gain;S.players[d.i].cash+=gain;note(S.players[d.i].name+' Boat '+(d.result.k+1)+' sells '+d.b.cargo+' tonnes at '+m.name+' for $'+gain+' ($'+payout+'/tonne)'+(d.result.bluff!==null?'; bluffed at '+S.markets[d.result.bluff].name:''));d.b.cargo=0;d.b.zone=3});
});
 S.euroReport={round:S.round,boats,ports:portResults};S.euro=null;S.phase='euroResults';render()
}
function finishRound(){
S.firstPlayer=(S.firstPlayer+1)%S.players.length;
note('First Player marker advances to '+S.players[S.firstPlayer].name+'.');
// Each port consumes two tonnes. Both spaces are cleared, so even a half-filled level stays half-filled.
S.markets.forEach(m=>{m.price=Math.min(25,m.price+1)});
note('European ports consume 2 tonnes each. Listed prices recover by up to $1 (maximum $25); half-filled spaces carry forward.');
if(S.finalMoves>0){
S.finalMoves--;
if(S.finalMoves===0){S.phase='end';note('Final European sale complete. The Guano Age ends.')}
else{S.round++;S.phase='finalSail';note('One final ship movement remains.')}
}else{S.round++;S.phase=S.exhausted?'peru':'produce'}
render()
}
function sail(){
let final=S.docksClosed;
S.players.forEach((p,i)=>p.boats.forEach((b,k)=>{
if(b.zone===0){
let depart=final?b.cargo>0:(i===0?document.getElementById('depart'+k).checked:b.cargo>=3);
if(depart&&b.cargo)b.zone=1
}else if(b.zone===1)b.zone=2;
else if(b.zone===3&&!final)b.zone=0
}));
note((final?'Final voyage: ':'Ships advance. ')+S.players.reduce((a,p)=>a+p.boats.filter(b=>b.zone===2&&b.cargo>0).length,0)+' loaded boats in Europe.');
initEurope()
}
start();
</script></html>
